<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <style>
        label{
            font-size: x-large;
        }
        input{
            font-size: x-large;
            border-radius: 10px;
        
        }
        #ptk1{
            background-color: red;
            color: black;
            margin-top: 20px;
           
           
        }
        .c1{
            height: 600px;
            width: 500px;
            border: 2px solid black;
            text-align: left;
            padding: 20px;
            border-radius: 20px;
            margin: 40px;
            background-color:pink;
        }
        body{
            display: flex;
            justify-content: center;
            background-color:rgb(226, 141, 43);
        }
        span{
            color: red;
            font-size: larger;
        }
    </style>
</head>
<body>
    <div class="c1">
    <h1>Registration Form</h1>
    <form onsubmit="return valid()" name="myforms">
        <label>Full Name:</label>
        <input id="t1" type="text" placeholder="Enter name" name="data1" /><span id="id1"><br></span><br><br>
        <label>Username:</label>
        <input id="t2" type="text" placeholder="Enter username" name="data2" /><span id="id2"><br></span><br><br>
        <label>Email:</label>
        <input id="t3" type="email" placeholder="Enter email" name="data3" /><span id="id3"><br></span><br><br>
        <label>Phone Number:</label>
        <input id="t4" type="tel" placeholder="Enter number" name="data4" /><span id="id4"><br></span><br><br>
        <label>Password:</label>
        <input id="t5" type="password" placeholder="Enter password" name="data5" /><span id="id5"><br></span><br><br>
        <label>Confirm Password:</label>
        <input id="t6" type="password" placeholder="Confirm password" name="data6" /><span id="id6"><br></span><br><br>
        <center><input  id="ptk1"type="submit" value="login" /></center>
    </form>
    </div>


    <script>
        function valid() {
            let a = document.forms["myforms"]["data1"].value;
            let b = document.forms["myforms"]["data2"].value;
            let c = document.forms["myforms"]["data3"].value;
            let d = document.forms["myforms"]["data4"].value;
            let e = document.forms["myforms"]["data5"].value;
            let f = document.forms["myforms"]["data6"].value;
            let n1 = /^[A-Za-z]{3,6}$/;          
            let n2 = /^[A-Za-z0-9]{2,5}$/;                   
            let n3 = /^[a-zA-Z0-9.@_%+-]+@gmail.com$/;        
            let n4 = /^[0-9]{10}$/                     
            let n5 = /^(?=.*[@#_$])(?=.*[0-9])[A-Za-z0-9@#_$]{6,15}$/;

            

            if (!n1.test(a)) {
                alert("username successfully");
                document.getElementById("t1").style.backgroundColor = "blue";
                document.getElementById("id1").innerHTML = "Enter valid full name";
                return false;
            }

            if (!n2.test(b)) {
                alert("user successfully");
                document.getElementById("t2").style.backgroundColor = "pink";
                document.getElementById("id2").innerHTML = "Username should be 2-5 characters";
                return false;
            }

            if (!n3.test(c)) {
                alert("enter email is successfully ");
                document.getElementById("t3").style.backgroundColor = "yellow";
                document.getElementById("id3").innerHTML = "Enter valid email address";
                return false;
            }

            if (!n4.test(d)) {
                alert("phone number successfully");
                document.getElementById("t4").style.backgroundColor = "green";
                document.getElementById("id4").innerHTML = "Enter valid 10-digit mobile number";
                return false;
            }

            if (!n5.test(e)) {
                alert("password correctly");
                document.getElementById("t5").style.backgroundColor = "red";
                document.getElementById("id5").innerHTML = "Password must be 6-15 characters with number and @,#,_,$";
                return false;
            }

            if (e !== f) {
                alert("Passwords do not match");
                document.getElementById("t6").style.backgroundColor = "gold";
                document.getElementById("id6").innerHTML = "Confirm password does not match";
                return false;
            }

            alert("Registration Successful");
            return true;
        }
        
    </script>
</body>
</html>
